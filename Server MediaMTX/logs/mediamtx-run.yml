# --- API de monitoring ---
api: yes
apiAddress: :9997

# Par dÃ©faut MediaMTX restreint l'accÃ¨s API Ã  127.0.0.1/::1 (401 pour tout
# autre appelant, mÃªme sans mot de passe configurÃ©). On l'ouvre au LAN pour
# le scan et le monitoring depuis mtx-audio-router.
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: any
    pass:
    ips: []
    permissions:
      - action: api
      - action: metrics
      - action: pprof

# --- Logs ---
logLevel: info
logDestinations: [stdout, file]
logFile: logs/mediamtx_20261106_020454.log

# --- Limites globales ---
readTimeout: 10s
writeTimeout: 10s


###############################################################################
# Serveur SRT
###############################################################################
srt: yes
srtAddress: :8890


###############################################################################
# DÃ©sactiver les protocoles inutiles (sÃ©curitÃ© + performances)
###############################################################################
rtsp: no
rtmp: no
hls: no
webrtc: no


