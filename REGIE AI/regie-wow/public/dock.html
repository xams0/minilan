<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Régie</title>
<style>
  /* Dock compact pour OBS (Docks > Docks de navigateur personnalisés) sur le PC Stream */
  :root { --bg: #1e1f22; --p: #2a2c31; --l: #3a3d44; --t: #e6e8ec; --d: #9aa0ab; --a: #f5b301; --live: #ff3b4e; --ok: #2fd27a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--t); font: 13px system-ui, "Segoe UI", sans-serif; padding: 8px; }
  .sec { margin-bottom: 10px; }
  .lbl { font-size: 10px; letter-spacing: .12em; color: var(--d); text-transform: uppercase; margin: 0 0 4px; display: flex; justify-content: space-between; }
  .row { display: flex; gap: 4px; }
  .row > * { flex: 1; }
  button { font: inherit; font-weight: 700; color: var(--t); background: var(--p); border: 1px solid var(--l); border-radius: 6px; padding: 7px 4px; cursor: pointer; }
  button:hover { border-color: var(--d); }
  button.sel { background: var(--a); color: #111; border-color: var(--a); }
  button.big { padding: 10px 4px; font-size: 13px; }
  .onair { background: var(--p); border: 1px solid var(--l); border-left: 4px solid var(--live); border-radius: 6px; padding: 7px 9px; }
  .onair b { font-size: 14px; }
  .dim { color: var(--d); font-size: 12px; }
  .players { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .pl { text-align: left; padding: 6px 7px; display: flex; flex-direction: column; gap: 3px; position: relative; }
  .pl .n { display: flex; justify-content: space-between; gap: 4px; }
  .pl.live { border-color: var(--live); box-shadow: inset 0 0 0 1px var(--live); }
  .pl.priv { opacity: .4; }
  .pl.picked { border-color: var(--a); box-shadow: inset 0 0 0 1px var(--a); }
  .pl small { font-weight: 400; color: var(--d); font-size: 11px; }
  .bar { height: 3px; background: #0005; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #4aa3ff, var(--a), var(--live)); }
  .st { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .st span { font-size: 11px; color: var(--d); }
  .st span.on::before { content: "● "; color: var(--ok); }
  .st span:not(.on)::before { content: "● "; color: var(--live); }
  .sugg { border: 1px dashed var(--a); border-radius: 6px; padding: 6px 8px; margin-top: 6px; display: flex; gap: 6px; align-items: center; }
  .sugg span { flex: 1; }
  .vote div { display: flex; justify-content: space-between; padding: 1px 0; }
  a { color: var(--d); }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="st" id="st"></div>

<div class="sec">
  <div class="row">
    <button class="big" data-mode="AUTO">AUTO IA</button><button class="big" data-mode="CHAT">CHAT</button><button class="big" data-mode="MANUEL">MANUEL</button>
  </div>
  <div class="row" style="margin-top:4px"><button id="lock">🔓 Libre</button><button id="board">📊 Classement</button></div>
</div>

<div class="sec">
  <div class="onair"><b id="cur">—</b> <span class="dim" id="hold"></span><div class="dim" id="why"></div></div>
  <div class="sugg hide" id="sugg"><span id="suggT"></span><button id="suggB">Prendre</button></div>
</div>

<div class="sec">
  <p class="lbl"><span>POV</span><span id="compHint"></span></p>
  <div class="row" id="types" style="margin-bottom:4px"></div>
  <div class="players" id="players"></div>
</div>

<div class="sec">
  <p class="lbl"><span>Casters</span><span id="pres"></span></p>
  <div class="row" id="cast">
    <button data-c="AUTO">AUTO</button><button data-c="OFF">OFF</button><button data-c="PIP">PIP</button><button data-c="SPLIT">SPLIT</button><button data-c="FULL">FULL</button>
  </div>
</div>

<div class="sec hide" id="voteSec">
  <p class="lbl"><span>Vote du chat</span><span id="voteT"></span></p>
  <div class="vote" id="vote"></div>
</div>

<div class="sec hide" id="spotSec">
  <p class="lbl"><span>Projecteurs en attente</span></p>
  <div class="dim" id="spot"></div>
  <div class="row" style="margin-top:4px"><button id="spotRun">Lancer</button><button id="spotDrop">Ignorer</button></div>
</div>

<div class="dim">Clavier (dock actif) : 1-9 plein écran · A / C / M modes · L verrou · <a href="/" target="_blank">panneau complet</a></div>

<script>
const $ = s => document.querySelector(s);
const TYPES = [['FULL', 'Plein', 1], ['SPLIT', 'Split', 2], ['PIP', 'PIP', 2], ['QUAD', 'Quad', 4], ['MOSAIC', 'Mosa.', 0], ['ROOM', 'Pièce', 0]];
let ws, S, names = [], hasRoom = false, comp = { type: 'FULL', picks: [] };
const send = o => ws?.readyState === 1 && ws.send(JSON.stringify(o));
const mmss = s => { s = Math.round(Math.abs(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws?role=panel`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'config') { names = m.players; hasRoom = m.hasRoom; build(); }
    if (m.type === 'state') { S = m.state; render(); }
  };
  ws.onclose = () => setTimeout(connect, 1500);
}

function build() {
  $('#types').innerHTML = TYPES.filter(t => t[0] !== 'ROOM' || hasRoom).map(([t, l]) => `<button data-t="${t}">${l}</button>`).join('');
  $('#players').innerHTML = names.map((n, i) => `<button class="pl" data-i="${i}"><span class="n"><span>${i + 1}. ${n}</span><small id="d${i}"></small></span><span class="bar"><i id="b${i}"></i></span></button>`).join('');
  paintComp();
}

function paintComp() {
  document.querySelectorAll('#types button').forEach(b => b.classList.toggle('sel', b.dataset.t === comp.type));
  document.querySelectorAll('.pl').forEach(b => b.classList.toggle('picked', comp.picks.includes(+b.dataset.i)));
  const need = TYPES.find(t => t[0] === comp.type)[2];
  $('#compHint').textContent = need > 1 ? `${comp.picks.length}/${need}` : '';
}

function pick(i) {
  if (comp.picks.includes(i)) return;
  comp.picks.push(i);
  if (comp.picks.length >= TYPES.find(t => t[0] === comp.type)[2]) {
    send({ cmd: 'take', layout: { type: comp.type, players: comp.picks } });
    comp = { type: 'FULL', picks: [] };
  }
  paintComp();
}

function render() {
  const s = S;
  $('#st').innerHTML = [['pc1', 'PC POV'], ['pc2', 'PC Stream'], ['twitch', 'Twitch'], ['llm', 'IA']].map(([k, l]) => `<span class="${s.status[k] ? 'on' : ''}">${l}</span>`).join('');
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('sel', b.dataset.mode === s.mode));
  $('#lock').textContent = s.locked ? '🔒 Verrouillé' : '🔓 Libre';
  $('#lock').classList.toggle('sel', s.locked);
  $('#cur').textContent = s.current.label;
  const left = s.current.timedUntil > s.now ? ` · ${Math.ceil((s.current.timedUntil - s.now) / 1000)}s` : '';
  $('#hold').textContent = mmss(s.current.holdSec) + left;
  $('#why').textContent = s.current.reason;
  const showSugg = s.suggestion && s.suggestion.label !== s.current.label && (s.mode === 'MANUEL' || s.locked);
  $('#sugg').classList.toggle('hide', !showSugg);
  if (showSugg) $('#suggT').textContent = `💡 ${s.suggestion.label}`;
  for (const p of s.players) {
    const b = document.querySelector(`.pl[data-i="${p.i}"]`); if (!b) continue;
    b.classList.toggle('live', p.shown); b.classList.toggle('priv', p.private);
    $(`#b${p.i}`).style.width = `${Math.min(100, p.interest * 10)}%`;
    $(`#d${p.i}`).textContent = p.private ? 'privé' : p.afk ? 'AFK' : Math.abs(p.debt) < 30 ? '' : (p.debt > 0 ? '−' : '+') + mmss(p.debt);
  }
  const c = s.caster;
  document.querySelectorAll('#cast button').forEach(b => b.classList.toggle('sel', b.dataset.c === c.mode));
  $('#pres').textContent = `${c.present ? 'présent' : 'absent'}${c.talking ? ' · parle' : ''} · ${c.applied}`;
  $('#voteSec').classList.toggle('hide', !s.vote);
  if (s.vote) {
    $('#voteT').textContent = `${Math.max(0, Math.ceil((s.vote.endsAt - s.now) / 1000))}s · ${s.vote.total} votants`;
    $('#vote').innerHTML = [...s.vote.options].sort((a, b) => b.n - a.n).slice(0, 4).map(o => `<div><span>${o.label}</span><b>${o.n}</b></div>`).join('');
  }
  $('#spotSec').classList.toggle('hide', !s.spotQueue.length);
  $('#spot').textContent = s.spotQueue.map(x => `${x.label} (${x.by})`).join(', ');
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mode) send({ cmd: 'mode', mode: b.dataset.mode });
  else if (b.dataset.c) send({ cmd: 'caster', mode: b.dataset.c });
  else if (b.dataset.t) {
    const need = TYPES.find(t => t[0] === b.dataset.t)[2];
    if (need === 0) { send({ cmd: 'take', layout: { type: b.dataset.t, players: [] } }); comp = { type: 'FULL', picks: [] }; }
    else comp = { type: b.dataset.t, picks: [] };
    paintComp();
  } else if (b.dataset.i !== undefined) pick(+b.dataset.i);
  else if (b.id === 'lock') send({ cmd: 'lock', value: !S.locked });
  else if (b.id === 'board') send({ cmd: 'board' });
  else if (b.id === 'suggB') send({ cmd: 'applySuggestion' });
  else if (b.id === 'spotRun') send({ cmd: 'spot', action: 'run' });
  else if (b.id === 'spotDrop') send({ cmd: 'spot', action: 'drop' });
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (/^[1-9]$/.test(k) && +k <= names.length) send({ cmd: 'take', layout: { type: 'FULL', players: [+k - 1] } });
  if (k === 'a') send({ cmd: 'mode', mode: 'AUTO' });
  if (k === 'c') send({ cmd: 'mode', mode: 'CHAT' });
  if (k === 'm') send({ cmd: 'mode', mode: 'MANUEL' });
  if (k === 'l' && S) send({ cmd: 'lock', value: !S.locked });
});
connect();
</script>
</body>
</html>
