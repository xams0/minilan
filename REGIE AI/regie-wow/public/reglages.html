<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réglages · Régie WoW</title>
<style>
  :root {
    --bg: #0d0f14; --panel: #161a22; --panel2: #1d222c; --line: #2a303c;
    --txt: #e8ebf1; --dim: #8a93a6; --accent: #f5b301; --live: #ff3b4e; --ok: #2fd27a; --warn: #ff9d2e;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 116px; }
  body { margin: 0; background: var(--bg); color: var(--txt); font-size: 15px; }
  a { color: inherit; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 16px; letter-spacing: .12em; margin: 0; text-transform: uppercase; }
  .spacer { flex: 1; }
  .chip { font-size: 12px; padding: 3px 8px; border-radius: 99px; background: var(--panel2); color: var(--dim); border: 1px solid var(--line); white-space: nowrap; }
  .chip.on { color: var(--ok); border-color: #2fd27a55; }
  button, .btn { font: inherit; color: var(--txt); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; text-decoration: none; }
  button:hover, .btn:hover { border-color: var(--dim); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 700; }
  button.small { padding: 5px 9px; font-size: 13px; border-radius: 8px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  nav { display: flex; gap: 4px; overflow-x: auto; padding: 0 12px 8px; max-width: 1180px; margin: 0 auto; }
  nav a { color: var(--dim); font-size: 13px; padding: 4px 8px; border-radius: 7px; text-decoration: none; white-space: nowrap; }
  nav a:hover { color: var(--txt); background: var(--panel2); }
  .notice { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 16px; background: #f5b30114; border-bottom: 1px solid #f5b30144; }
  .notice[hidden] { display: none; }
  main { max-width: 1180px; margin: 0 auto; padding: 14px 16px 60px; display: grid; gap: 14px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
  h2 { margin: 0 0 3px; font-size: 16px; }
  h3 { margin: 18px 0 8px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .intro { margin: 0 0 12px; color: var(--dim); font-size: 13px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px 16px; margin-top: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field > span, .group > span { font-size: 13px; font-weight: 600; }
  small { color: var(--dim); font-size: 12px; line-height: 1.35; }
  input, select { font: inherit; width: 100%; min-width: 0; background: var(--panel2); color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; margin: 0; }
  .check { flex-direction: row; align-items: flex-start; gap: 9px; }
  .check div { display: flex; flex-direction: column; gap: 2px; }
  .check span { font-size: 13px; font-weight: 600; }
  .pw { display: flex; gap: 6px; }
  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .rect { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .rect label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--dim); min-width: 0; }
  .bad { border-color: var(--live) !important; }
  .miss { border-color: var(--warn); }
  .msg { font-size: 12px; }
  .msg.err { color: var(--live); }
  .msg.warn { color: var(--warn); }
  .test { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
  .test .r { font-size: 13px; color: var(--dim); }
  .test .r.ok { color: var(--ok); }
  .test .r.err { color: var(--live); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--dim); padding: 0 6px 6px; }
  td { padding: 3px 6px; vertical-align: top; }
  td.n { width: 28px; color: var(--dim); padding-top: 10px; font-variant-numeric: tabular-nums; }
  td.x { width: 44px; }
  .layouts { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px 16px; }
  .group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #status { font-size: 13px; color: var(--dim); }
  #status.err { color: var(--live); }
  #status.ok { color: var(--ok); }
  #denied { max-width: 560px; margin: 60px auto; padding: 0 16px; }
  @media (max-width: 560px) { .fields, .layouts { grid-template-columns: minmax(0, 1fr); } html { scroll-padding-top: 150px; } }
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (v !== undefined) n.setAttribute(k, v);
  }
  n.append(...kids.filter(Boolean));
  return n;
};

    { p: 'scheduleEnabled', l: 'Activer le planning', t: 'bool', h: 'Désactivé, les créneaux restent enregistrés mais le mode ne change plus tout seul. Le mode Chat a besoin de Twitch.' }
  ], custom: 'schedule' }
];

let cfg, saved, runtime, rewardRows = [];
const obsLists = {};

const getPath = (o, p) => p.split('.').reduce((v, k) => v?.[k], o);
function setPath(o, p, val) {
  const keys = p.split('.');
  const last = keys.pop();
  keys.reduce((v, k) => v[k], o)[last] = val;
}

// ---- Lecture et écriture d'un champ ----
function readInput(input, f) {
  if (f.t === 'bool') return input.checked;
  if (f.t === 'num') return input.value.trim() === '' ? null : Number(input.value);
  if (f.t === 'null') return input.value.trim() === '' ? null : input.value;
  if (f.t === 'list') return input.value.split(',').map(s => s.trim()).filter(Boolean);
  return input.value;
}

function makeInput(f) {
  const v = getPath(cfg, f.p);
  const common = { 'data-p': f.p, id: `f-${f.p}` };
  let input;
  if (f.t === 'select') {
    input = el('select', common, ...f.o.map(([val, txt]) => el('option', { value: val, text: txt })));
    input.value = v;
  } else if (f.t === 'bool') {
    input = el('input', { ...common, type: 'checkbox' });
    input.checked = !!v;
  } else {
    input = el('input', { ...common, type: f.t === 'num' ? 'number' : f.t === 'password' ? 'password' : 'text', list: f.list, placeholder: f.ph, min: f.min, max: f.max, step: f.t === 'num' ? (f.step ?? 'any') : undefined, autocomplete: f.t === 'password' ? 'new-password' : 'off', spellcheck: 'false', 'aria-label': f.a });
    input.value = Array.isArray(v) ? v.join(', ') : (v ?? '');
  }
  if (f.check) input.dataset.check = f.check;
  input.addEventListener(f.t === 'bool' || f.t === 'select' ? 'change' : 'input', () => {
    setPath(cfg, f.p, readInput(input, f));
    clearFieldMsg(input);
    if (input.dataset.check) checkNames();
    markDirty();
  });
  return input;
}

function makeField(f) {
  if (f.pair) {
    return el('div', { class: 'group' }, el('span', { text: f.pair }), el('div', { class: 'pair' }, ...f.fields.map(makeInput)));
  }
  const input = makeInput(f);
  if (f.t === 'bool') {
    return el('label', { class: 'field check' }, input, el('div', {}, el('span', { text: f.l }), f.h ? el('small', { text: f.h }) : null));
  }
  let control = input;
  if (f.t === 'password') {
    const eye = el('button', { type: 'button', class: 'small', text: 'Voir' });
    eye.onclick = () => { const show = input.type === 'password'; input.type = show ? 'text' : 'password'; eye.textContent = show ? 'Cacher' : 'Voir'; };
    control = el('div', { class: 'pw' }, input, eye);
  }
  return el('div', { class: 'field' }, el('label', { for: input.id, text: f.l, style: 'font-size:13px;font-weight:600' }), control, f.h ? el('small', { text: f.h }) : null);
}

// ---- Blocs spécifiques ----
function layoutsBlock() {
  const names = { OFF: 'Sans casters', PIP: 'Casters en PIP', SPLIT: 'Casters en split', FULL: 'Casters en plein écran' };
  const rect = (path, title) => el('div', { class: 'group' }, el('span', { text: title }), el('div', { class: 'rect' },
    ...['X', 'Y', 'Largeur', 'Hauteur'].map((lbl, i) => el('label', {}, lbl, makeInput({ p: `${path}.${i}`, t: 'num' })))));
  const wrap = el('div', {}, el('h3', { text: 'Disposition, en pixels' }), el('p', { class: 'intro', text: 'Si tu déplaces le PIP des casters dans OBS, la régie retient cette position. Modifier ici « Casters en PIP : caméra » la remplace.' }));
  const grid = el('div', { class: 'layouts' });
  for (const [m, name] of Object.entries(names)) {
    grid.append(rect(`pc2.layouts.${m}.game`, `${name} : jeu`));
    if (m !== 'OFF') grid.append(rect(`pc2.layouts.${m}.cam`, `${name} : caméra`));
  }
  wrap.append(grid);
  return wrap;
}

function playersBlock() {
  const body = el('tbody');
  cfg.players.forEach((_, i) => body.append(el('tr', {},
    el('td', { class: 'n', text: i + 1 }),
    el('td', {}, makeInput({ p: `players.${i}.name`, t: 'text', a: `Pseudo du joueur ${i + 1}` })),
    el('td', {}, makeInput({ p: `players.${i}.source`, t: 'text', list: 'dl-pc1-inputs', check: 'pc1:inputs', a: `Source OBS du joueur ${i + 1}` })),
    el('td', {}, makeInput({ p: `players.${i}.mic`, t: 'null', list: 'dl-pc1-inputs', check: 'pc1:inputs', a: `Micro du joueur ${i + 1}` })))));
  return el('div', { class: 'scroll' }, el('table', {},
    el('thead', {}, el('tr', {}, el('th', {}), el('th', { text: 'Pseudo' }), el('th', { text: 'Source POV dans OBS' }), el('th', { text: 'Micro (optionnel)' }))), body));
}

function rewardsBlock() {
  const wrap = el('div', {}, el('h3', { text: 'Points de chaîne' }), el('p', { class: 'intro', text: 'Rachète la récompense une fois : son ID apparaît dans le panneau.' }));
  const body = el('tbody');
  const draw = () => {
    body.replaceChildren(...rewardRows.map((r, i) => {
      const id = el('input', { type: 'text', spellcheck: 'false', 'aria-label': 'ID de la récompense', placeholder: 'ID de la récompense' });
      id.value = r.id;
      id.oninput = () => { r.id = id.value; markDirty(); };
      const act = el('select', { 'aria-label': 'Action' }, el('option', { value: 'spotlight', text: 'Coup de projecteur' }), el('option', { value: 'split', text: 'Split de deux joueurs au hasard' }), el('option', { value: 'mosaic', text: 'Mosaïque' }));
      act.value = r.action;
      act.onchange = () => { r.action = act.value; markDirty(); };
      const del = el('button', { type: 'button', class: 'small', text: 'Retirer', 'aria-label': 'Retirer cette récompense' });
      del.onclick = () => { rewardRows.splice(i, 1); draw(); markDirty(); };
      return el('tr', {}, el('td', {}, id), el('td', {}, act), el('td', { class: 'x' }, del));
    }));
  };
  draw();
  const add = el('button', { type: 'button', class: 'small', text: 'Ajouter une récompense', style: 'margin-top:8px' });
  add.onclick = () => { rewardRows.push({ id: '', action: 'spotlight' }); draw(); markDirty(); };
  wrap.append(el('div', { class: 'scroll' }, el('table', {}, body)), add);
  return wrap;
}

function scheduleBlock() {
  const wrap = el('div', {});
  const body = el('tbody');
  const draw = () => {
    body.replaceChildren(...cfg.schedule.map((_, i) => {
      const del = el('button', { type: 'button', class: 'small', text: 'Retirer', 'aria-label': 'Retirer ce créneau' });
      del.onclick = () => { cfg.schedule.splice(i, 1); draw(); markDirty(); };
      return el('tr', {},
        el('td', {}, makeInput({ p: `schedule.${i}.minute`, t: 'num', min: 0, max: 59, a: 'Minute de début' })),
        el('td', {}, makeInput({ p: `schedule.${i}.durationMin`, t: 'num', min: 1, a: 'Durée en minutes' })),
        el('td', {}, makeInput({ p: `schedule.${i}.mode`, t: 'select', o: [['CHAT', 'Chat'], ['AUTO', 'Auto IA'], ['MANUEL', 'Manuel']] })),
        el('td', { class: 'x' }, del));
    }));
  };
  draw();
  const add = el('button', { type: 'button', class: 'small', text: 'Ajouter un créneau', style: 'margin-top:8px' });
  add.onclick = () => { cfg.schedule.push({ minute: 0, durationMin: 15, mode: 'CHAT' }); draw(); markDirty(); };
  wrap.append(el('div', { class: 'scroll' }, el('table', {},
    el('thead', {}, el('tr', {}, el('th', { text: 'Minute de début' }), el('th', { text: 'Durée (min)' }), el('th', { text: 'Mode' }), el('th', {}))), body)), add);
  return wrap;
}

const CUSTOM = { layouts: layoutsBlock, players: playersBlock, rewards: rewardsBlock, schedule: scheduleBlock };

// ---- Test de connexion à OBS (lecture seule) ----
function testBlock(pc) {
  const btn = el('button', { type: 'button', text: 'Tester la connexion' });
  const out = el('span', { class: 'r', role: 'status', text: 'Lecture seule : ne modifie rien dans OBS. Propose ensuite ses scènes et ses sources dans les champs.' });
  btn.onclick = async () => {
    btn.disabled = true;
    out.className = 'r';
    out.textContent = 'Connexion…';
    try {
      const r = await post('/api/obs-test', { url: cfg[pc].url, password: cfg[pc].password });
      if (!r.ok) { out.className = 'r err'; out.textContent = r.error; delete obsLists[pc]; }
      else {
        out.className = 'r ok';
        out.textContent = `Connecté à OBS ${r.version} : ${r.scenes.length} scènes, ${r.inputs.length} sources. À l'antenne : ${r.program}.`;
        obsLists[pc] = { scenes: r.scenes, inputs: [...r.inputs, ...r.scenes] };
        const fill = (id, names) => $(id).replaceChildren(...[...new Set(names)].map(v => el('option', { value: v })));
        fill(`#dl-${pc}-scenes`, r.scenes);
        fill(`#dl-${pc}-inputs`, obsLists[pc].inputs);
      }
    } catch (e) { out.className = 'r err'; out.textContent = e.message; }
    btn.disabled = false;
    checkNames();
  };
  return el('div', { class: 'test' }, btn, out);
}

/** Signale les noms absents de l'OBS testé */
function checkNames() {
  document.querySelectorAll('[data-check]').forEach(input => {
    const [pc, kind] = input.dataset.check.split(':');
    const known = obsLists[pc]?.[kind];
    const names = input.value.split(input.dataset.p === 'pc2.casterMics' ? ',' : '\n').map(s => s.trim()).filter(Boolean);
    const missing = known ? names.filter(n => !known.includes(n)) : [];
    input.classList.toggle('miss', missing.length > 0);
    const box = input.parentElement;
    box.querySelector(':scope > .msg.warn')?.remove();
    if (missing.length) box.append(el('small', { class: 'msg warn', text: `Introuvable dans cet OBS : ${missing.join(', ')}` }));
  });
}

// ---- Affichage ----
function render() {
  $('#nav').replaceChildren(...SECTIONS.map(s => el('a', { href: `#${s.id}`, text: s.title })));
  $('#main').replaceChildren(...SECTIONS.map(s => {
    const sec = el('section', { id: s.id }, el('h2', { text: s.title }));
    if (s.intro) sec.append(el('p', { class: 'intro', text: s.intro }));
    if (s.fields) sec.append(el('div', { class: 'fields' }, ...s.fields.map(makeField)));
    if (s.obs) sec.append(testBlock(s.obs));
    if (s.custom) sec.append(CUSTOM[s.custom]());
    return sec;
  }));
  checkNames();
}

function renderRuntime() {
  const chipObs = $('#chipObs');
  chipObs.textContent = runtime.obsActive ? 'Pilotage OBS : actif' : (runtime.noObsFlag ? 'Pilotage OBS : coupé par --no-obs' : 'Pilotage OBS : coupé');
  chipObs.classList.toggle('on', runtime.obsActive);
  for (const [id, pc, name] of [['#chipPc1', 'pc1', 'PC POV'], ['#chipPc2', 'pc2', 'PC Stream']]) {
    $(id).hidden = !runtime.obsActive;
    $(id).textContent = `${name} : ${runtime.status[pc] ? 'connecté' : 'non connecté'}`;
    $(id).classList.toggle('on', !!runtime.status[pc]);
  }
}

function showRestart(needed) {
  $('#restartBar').hidden = !needed;
  $('#restart').hidden = !runtime?.canRestart;
  $('#restartText').textContent = runtime?.canRestart
    ? 'Enregistré dans config.json. Il reste à redémarrer la régie pour appliquer ces réglages.'
    : 'Enregistré dans config.json. Relance la régie avec npm start pour appliquer ces réglages.';
}

const status = (text, cls = '') => { $('#status').textContent = text; $('#status').className = cls; };
function markDirty() {
  $('#save').disabled = false;
  $('#revert').disabled = false;
  status('Modifications non enregistrées');
}

function clearFieldMsg(input) {
  input.classList.remove('bad');
  input.parentElement.querySelector(':scope > .msg.err')?.remove();
}

function showErrors(errors) {
  document.querySelectorAll('.bad').forEach(clearFieldMsg);
  let first = null, orphan = [];
  for (const { path, msg } of errors) {
    const input = document.querySelector(`[data-p="${path}"]`);
    if (!input) { orphan.push(`${path} ${msg}`); continue; }
    input.classList.add('bad');
    input.parentElement.append(el('small', { class: 'msg err', text: msg }));
    first ??= input;
  }
  first?.focus();
  const n = errors.length;
  status(orphan.length ? orphan.join(' · ') : `${n} ${n > 1 ? 'erreurs à corriger' : 'erreur à corriger'}`, 'err');
}

// ---- Échanges avec le serveur ----
async function post(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  return res.json();
}

function buildRewards() {
  const kept = Object.entries(cfg.twitch.rewards).filter(([k]) => k.startsWith('_'));
  const rows = rewardRows.filter(r => r.id.trim()).map(r => [r.id.trim(), r.action]);
  return Object.fromEntries([...kept, ...rows]);
}

function loadRewardRows() {
  rewardRows = Object.entries(cfg.twitch.rewards).filter(([k]) => !k.startsWith('_')).map(([id, action]) => ({ id, action }));
}

async function save() {
  $('#save').disabled = true;
  status('Enregistrement…');
  cfg.twitch.rewards = buildRewards();
  try {
    const r = await post('/api/config', cfg);
    if (!r.ok) { $('#save').disabled = false; if (r.errors) showErrors(r.errors); else status(r.error, 'err'); return; }
    saved = JSON.stringify(cfg);
    document.querySelectorAll('.bad').forEach(clearFieldMsg);
    $('#revert').disabled = true;
    status('Enregistré', 'ok');
    showRestart(r.needsRestart);
  } catch (e) { $('#save').disabled = false; status(`Échec : ${e.message}`, 'err'); }
}

async function restart() {
  const btn = $('#restart');
  btn.disabled = true;
  status('Redémarrage…');
  try {
    const r = await post('/api/restart', {});
    if (!r.ok) { status(r.error, 'err'); btn.disabled = false; return; }
    const base = `${location.protocol}//${location.hostname}:${r.port}`;
    for (let i = 0; i < 40; i++) {
      await new Promise(ok => setTimeout(ok, 500));
      try { await fetch(`${base}/reglages`, { mode: 'no-cors', cache: 'no-store' }); location.href = `${base}/reglages`; return; } catch { /* pas encore relancée */ }
    }
    status('La régie ne répond plus. Regarde son terminal.', 'err');
  } catch (e) { status(`Échec : ${e.message}`, 'err'); }
  btn.disabled = false;
}

function revert() {
  cfg = JSON.parse(saved);
  loadRewardRows();
  render();
  $('#save').disabled = true;
  $('#revert').disabled = true;
  status('Modifications annulées');
}

async function refreshRuntime() {
  try {
    const res = await fetch('/api/config');
    if (!res.ok) return;
    runtime = (await res.json()).runtime;
    renderRuntime();
  } catch { /* redémarrage en cours */ }
}

async function init() {
  const res = await fetch('/api/config');
  const data = await res.json();
  if (res.status === 403) {
    $('#main').hidden = true;
    $('#save').hidden = $('#revert').hidden = true;
    $('#nav').hidden = true;
    const box = $('#denied');
    box.hidden = false;
    box.append(el('h2', { text: 'Réglages accessibles depuis le PC de la régie' }),
      el('p', { class: 'intro', text: 'Ils contiennent les mots de passe OBS et les tokens : ouvre http://127.0.0.1' + (location.port ? `:${location.port}` : '') + '/reglages sur ce PC.' }));
    return;
  }
  cfg = data.config;
  saved = JSON.stringify(cfg);
  runtime = data.runtime;
  loadRewardRows();
  render();
  renderRuntime();
  showRestart(data.needsRestart);
  setInterval(refreshRuntime, 5000);
}

$('#save').onclick = save;
$('#revert').onclick = revert;
$('#restart').onclick = restart;
addEventListener('beforeunload', e => { if (!$('#save').disabled) e.preventDefault(); });
init().catch(e => status(`Chargement impossible : ${e.message}`, 'err'));
</script>
</body>
